<!DOCTYPE html>
<html>
<head>
    <title>My Functions</title>
    <style>
        body { font-family: Inter; background: white; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .func-item {
            padding: 10px; border: 1px solid #ccc; margin: 8px 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; }
        .edit { background: #ffe4b5; }
        .delete { background: #ffcccc; }
        .add-new { background: orange; color: white; padding: 10px 15px; text-decoration: none; display: inline-block; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>My Functions</h2>
        <a href="/" class="btn" style="background:#aaa;color:white;">← Back</a>
    </div>

    {% for func in functions %}
    <div class="func-item">
    <span>{{ func.expression }}</span>
    <div>
        <a href="{{ url_for('edit_function', func_id=func.id) }}" class="btn edit">✏️ Edit</a>
        <form method="POST" action="{{ url_for('delete_function', func_id=func.id) }}" style="display:inline;">
            <button type="submit" class="btn delete" 
                onclick="return confirm('Delete this function?')">🗑️ Del</button>
        </form>
        <a href="{{ url_for('analysis', func_id=func.id) }}" class="btn analyze">🔍 Analyze</a>
        <a href="{{ url_for('graph', func_id=func.id) }}" class="btn graph">📈 Graph</a>
    </div>
</div>
    {% else %}
    <p>No functions yet.</p>
    {% endfor %}

    <a href="{{ url_for('new_function') }}" class="add-new">+ Add New</a>
</body>
</html>
