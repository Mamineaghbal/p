<!DOCTYPE html>
<html>
<head>
    <title>Edit Function</title>
    <style>
        body { font-family: Inter; background: white; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn-group {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .btn {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;
        }
        .cancel { background: #ddd; }
        .save { background: #32cd32; color: white; }
    </style>
</head>
<body>
    <h2>Edit Function</h2>

    <form method="POST">
        <div class="form-group">
            <label>Definition</label>
            <input type="text" name="definition" value="{{ func.expression }}" required>
        </div>

        <div class="form-group">
            <label>Type</label>
            <select name="type">
                <option value="function" {% if func.type == 'function' %}selected{% endif %}>Function</option>
                <option value="sequence" {% if func.type == 'sequence' %}selected{% endif %}>Sequence</option>
                <option value="series" {% if func.type == 'series' %}selected{% endif %}>Series</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>From</label>
                <input type="text" name="domain_from" value="{{ func.domain_from or 'ℝ' }}">
            </div>
            <div style="flex: 1;">
                <label>To</label>
                <input type="text" name="domain_to" value="{{ func.domain_to or 'ℝ' }}">
            </div>
        </div>

        <div class="btn-group">
            <a href="{{ url_for('function_list') }}" class="btn cancel">Cancel</a>
            <button type="submit" class="btn save">✓ Save Changes</button>
        </div>
    </form>
</body>
</html>
